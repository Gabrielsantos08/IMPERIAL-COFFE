<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <div class="formulario">
        <form method="ports" id="contato" action="mailto:ggabzinx@gmail.com">

<fieldset id="usuario">
    <legend>
Identificacao do usuario
    </legend>
<label for="cnome">Nome:</label>
<input type="text" name="tNome" id="cnome" size="20" maxlength="20" placeholder="Digite seu nome aqui"
autofocus required/>
<p>

    <label for="Csenha">Senha</label>
    <input type="password" name="tSenha" id="cSenha" size="8" maxlength="8" placeholder="8 digitos" required />
</p>

<p>

    <label for="cMail">Email:</label>
    <input type="email" name="tmail" id="cmail" size="30" maxlength="30" placeholder="8 digitos" required />
</p>

<fieldset id="sexo">
    <legend>sexo:</legend>
    <input type="radio" name="tsexo" id="CMasc"/>
    <label for="cmasc">Masculino</label>
<br>
    <input type="radio" name="tsexo" id="CMasc"/>
    <label for="cfem">Feminino</label>



</fieldset>

<P>
Data de nascimento: <input type="date" name="Tnasc" id="aaaa">
</P>

<fieldset>
    <legend>Endereco de usuario</legend>
</fieldset>
<P><label for="cRUa">imperador</label>
<input type="text" name="tRUA" id="cRUA" size="30" maxlength="50" placeholder="Rua, av, trav......" required/>
</P>
<p>
 <label for="cnum">Numero</label>
<input type="number" name="tNUm" id="cNUM" min="0" max="9999999999">
</p>

<p>

<label for="cEST">estado</label>
<select name="" id="">
<optgroup label="Regiao Sudeste">
<option value="SP" Selected >São Paulo</option>
<option value="MG" Selected >Minas gerais</option>
<option value="RJ" Selected >Rio de janeiro</option>
<option value="ES" Selected >Espirito Santo</option>
</optgroup>

<optgroup label="Regiao Sul">
<option value="PR" Selected >Parana</option>
<option value="SC" Selected >Santa catarina</option>
<option value="RJ" Selected >Rio grande do sul</option>
</optgroup>
</select>
</p>
<fieldset id="mensagem">
<legend>Mensagem do usario</legend>
<p>
<label for="cURG">Grau de urgencia</label>
MIN <input type="Range" name="Turg" id="cURG" min="0" max="10"/>MAX
</p>
<p>
<label for="Mensagem"></label><br>
<textarea name="tMSG" id="tMSG" cols="45" rows="5" placeholder="Deixe sua mensagem aqui" style="resize: none;"></textarea>

</p>


</fieldset>
<input type="submit" name="Enviar"/>
<input type="reset" name="Limpar"/>

</form>
</div>
</body>
</html>
